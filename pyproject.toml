[project]
name = "notimaps-scraper"
version = "0.1.0"
description = "A web scraper for news sites using Scrapy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.12",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
lambda = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
